name: Release Koodo Portable

on:
  push:
    tags:
      - "v*-portable.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  YARN_VERSION: "1.22.22"

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Type-check
        run: yarn tsc --noEmit

      - name: Test portable infrastructure
        run: node --test test/portable-infrastructure.test.js test/portable-migration.test.js

      - name: Build renderer
        run: yarn build

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Build renderer
        run: yarn build

      - name: Build unsigned DMG
        run: yarn release:mac --arm64

      - name: Require exactly one DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#files[@]}"
            exit 1
          fi

      - name: Attest macOS build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: "${{ github.workspace }}/dist/*.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Yarn Classic
        shell: bash
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Build renderer
        run: yarn build

      - name: Build portable EXE
        run: yarn release:win

      - name: Require exactly one EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -Filter *.exe -File)
          if ($files.Count -ne 1) {
            throw "Expected exactly one EXE, found $($files.Count)"
          }

      - name: Attest Windows build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: "${{ github.workspace }}/dist/*.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Generate checksums
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release/windows-x64

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/checksums
          shopt -s nullglob
          files=(release/macos-arm64/*.dmg release/windows-x64/*.exe)
          if [[ ${#files[@]} -ne 2 ]]; then
            echo "Expected two release files, found ${#files[@]}"
            exit 1
          fi
          : > release/checksums/SHA256SUMS.txt
          for file in "${files[@]}"; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$digest" "$(basename "$file")" \
              >> release/checksums/SHA256SUMS.txt
          done

      - name: Attest checksum manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: "${{ github.workspace }}/release/checksums/SHA256SUMS.txt"

      - name: Upload checksum manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checksums
          path: release/checksums/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish immutable release inputs
    needs: [validate, build-macos, build-windows, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release/windows-x64

      - name: Download checksum manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: checksums
          path: release/checksums

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release/macos-arm64/*.dmg
            release/windows-x64/*.exe
            release/checksums/SHA256SUMS.txt
          )
          if [[ ${#assets[@]} -ne 3 ]]; then
            echo "Expected three release assets, found ${#assets[@]}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Koodo Portable ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest
